[project]
name = "pipelinegen_histones"
version = "0.0.1"
description = "A plugin for training pipelines for the Histones project"
authors = [
    { name="Jeffrey Barahona", email="jeffreyabarahona@example.com" }
]
requires-python = ">=3.9,<3.10"
dependencies = [
    "imblearn>=0.0",
    "ipykernel>=6.29.5",
    "lmfit>=1.3.2",
    "matplotlib>=3.7.5",
    "nbformat>=4.2.0",
    "numpy>=1.24.4",
    "openpyxl>=3.1.5",
    "plotly>=6.0.1",
    "pycatch22>=0.4.5",
    "pytorch-lightning>=2.4.0",
    "rich>=13.9.4",
    "scikit-learn>=1.3.2",
    "scipy<=1.14.0",
    "seaborn>=0.13.2",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "tqdm>=4.67.1",
    "tsfel>=0.1.9",
    "tsfresh>=0.20.3",
    "xgboost>=2.1.4",
    "pipelinegen"
]

[dependency-groups]
dev = [
    "flake8>=5.0.4",
    "isort>=5.13.2",
    "mypy>=1.14.1",
    "pip-tools>=7.4.1",
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

[tool.uv.sources]
pipelinegen = {git = "https://github.com/jalebara/pipelinegen.git", branch="main"}

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
