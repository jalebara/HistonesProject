[project]
name = "pipelinegen_histones"
version = "0.0.1"
description = "A plugin for training pipelines for the Histones project"
authors = [
    { name="Jeffrey Barahona", email="jeffreyabarahona@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dataclasses>=0.8",
    "scikit-learn>=1.6.1",
    "pipelinegen",
    "pytorch-lightning>=2.5.0.post0",
    "pipelinegen",
    "plotly>=6.0.1",
]


[tool.uv.sources]
pipelinegen = {git = "https://github.com/jalebara/pipelinegen.git", branch="main"}


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
name = "pipelinegen-histones"
version = "0.0.1"
packages = [
    "src/pipelinegen_histones",
    "src/histones"
]

[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
