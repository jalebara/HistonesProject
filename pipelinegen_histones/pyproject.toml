[project]
name = "pipelinegen_histones"
version = "0.0.1"
description = "A plugin for training pipelines for the Histones project"
authors = [
    { name="Jeffrey Barahona", email="jeffreyabarahona@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dataclasses>=0.8",
    "scikit-learn>=1.6.1",
    "pipelinegen",
    "pytorch-lightning>=2.5.0.post0",
]


[tool.uv.sources]
pipelinegen = {git = "https://github.com/jalebara/pipelinegen.git"}


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
name = "pipelinegen-histones"
version = "0.0.1"
packages = [
    "src/pipelinegen_histones",
    "src/histones"
]

[tool.ruff]
line-length = 100
target-version = "py311"
